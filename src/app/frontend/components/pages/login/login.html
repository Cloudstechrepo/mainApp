 

<section class="login-section">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">
        <img src="favicon.png" alt="Brand_Logo">
      </div>
      <h2>Welcome to Cloudstech</h2> 
      <p>Sign in to continue to your account.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-4">
        <label class="form-label">Email Address</label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
            formControlName="email">
        </div>

        <small class="text-danger"
          *ngIf="f.email.touched && f.email.errors?.['required']">
          Email is required.
        </small>

        <small class="text-danger"
          *ngIf="f.email.touched && f.email.errors?.['email']">
          Please enter a valid email.
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>

        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            placeholder="Enter your password"
            formControlName="password">

          <button
            type="button"
            class="input-group-text password-toggle"
            (click)="togglePassword()">
            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>

        <small class="text-danger"
          *ngIf="f.password.touched && f.password.errors?.['required']">
          Password is required.
        </small>

        <small class="text-danger"
          *ngIf="f.password.touched && f.password.errors?.['minlength']">
          Password must be at least 6 characters.
        </small>
      </div>
      <!-- Login Button -->
      <button type="submit" class="btn login-btn w-100">
        Sign In
        <i class="bi bi-arrow-right ms-2"></i>
      </button>

    </form>

  </div>
</section>
