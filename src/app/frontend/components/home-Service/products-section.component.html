<section class="products py-5" aria-labelledby="products-title">
  <div class="container">
    <!-- Header -->
    <header class="text-center mb-5">
      <h2 id="products-title" class="display-4 fw-semibold mb-2">
        Available <span class="text-brand">Products</span>
      </h2>
      <p class="fs-6 text-secondary mb-0">
        We deliver high-quality products designed for reliability and performance.
      </p>
    </header> 

    <!-- Cards -->
    <div class="row g-4 mt-1" role="tabpanel">
      @for (product of categories; track product.id) {
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <article class="card h-100 border-0 rounded-0 shadow">
            <a routerLink="/" class="stretched-link" aria-label="HRMS Portal">
            <div class="ratio card-media">
              <img [src]="product.productsImage" alt="{{ product.productsImage }}" class="card-img-top rounded-0 object-fit-cover" loading="lazy" />
            </div>
            <div class="card-body d-flex align-items-center justify-content-center text-center py-4">
              <h3 class="card-title h5 fw-normal mb-0">{{ product.label }}</h3>
            </div>
            </a>
          </article>
        </div>
      }
    </div>
  </div>
</section>
